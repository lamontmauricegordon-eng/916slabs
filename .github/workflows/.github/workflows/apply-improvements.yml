name: Apply Improvements to 916slabs

on:
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  apply-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for all branches

      - name: Create directory structure
        run: |
          mkdir -p src/utils src/tests .github/workflows logs

      - name: Create README.md
        run: |
          cat > README.md << 'EOF'
          # 916slabs
          A TypeScript-based project deployed on Cloudflare Workers and Pages.

          ## Setup
          1. Install dependencies:
             ```bash
             npm install
             ```
          2. Build:
             ```bash
             npm run build
             ```
          3. Deploy to Cloudflare:
             ```bash
             npm run deploy
             ```

          ## API Reference
          - **Endpoint:** `/api/endpoint`
            - **Method:** `GET`
            - **Response:** `200 OK` (JSON)

          ## Testing
          Run tests:
          ```bash
          npm test
          ```

          ## CI/CD
          - Automated via GitHub Actions (test → build → deploy).
          - Uses `wrangler` for Cloudflare Workers and Pages deployment.

          ## Deployment
          - **Cloudflare Workers:** API endpoints
          - **Cloudflare Pages:** Static site hosting

          ## License
          MIT
          EOF

      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "916slabs",
            "version": "1.0.0",
            "description": "TypeScript project for Cloudflare Workers and Pages",
            "main": "src/index.ts",
            "scripts": {
              "build": "tsc",
              "test": "jest",
              "deploy": "wrangler deploy",
              "deploy:pages": "wrangler pages deploy dist",
              "dev": "wrangler dev",
              "audit": "npm audit",
              "lint": "eslint src/**/*.ts"
            },
            "dependencies": {
              "@cloudflare/workers-types": "^4.20240512.0",
              "eslint": "^8.56.0",
              "jest": "^29.7.0",
              "ts-jest": "^29.1.2",
              "typescript": "^5.3.3",
              "winston": "^3.11.0"
            },
            "devDependencies": {
              "@types/jest": "^29.5.12",
              "@types/node": "^20.11.0",
              "snyk": "^1.1234.0",
              "wrangler": "^3.45.0"
            }
          }
          EOF

      - name: Create tsconfig.json
        run: |
          cat > tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2021",
              "module": "ESNext",
              "lib": ["ES2021"],
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "outDir": "dist",
              "rootDir": "src",
              "resolveJsonModule": true,
              "declaration": true,
              "declarationMap": true,
              "sourceMap": true
            },
            "include": ["src/**/*"],
            "exclude": ["node_modules", "dist"]
          }
          EOF

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "916slabs"
          type = "javascript"
          account_id = ""
          workers_dev = true
          route = ""
          zone_id = ""

          [env.production]
          name = "916slabs-prod"
          routes = [
            { pattern = "example.com/*", zone_name = "example.com" }
          ]

          [build]
          command = "npm run build"
          cwd = "./"
          watch_paths = ["src/**/*.ts"]

          [build.upload]
          format = "service-worker"

          [site]
          bucket = "dist"

          [triggers.crons]
          crons = ["0 0 * * *"]
          EOF

      - name: Create CI/CD workflow
        run: |
          cat > .github/workflows/ci-cd.yml << 'EOF'
          name: CI/CD Pipeline

          on:
            push:
              branches: [ main ]
            pull_request:
              branches: [ main ]

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                - run: npm ci
                - run: npm test
                - run: npm run lint
                - run: npm audit

            build:
              needs: test
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                - run: npm ci
                - run: npm run build
                - uses: actions/upload-artifact@v3
                  with:
                    name: dist
                    path: dist/

            deploy-workers:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                - run: npm ci
                - run: npm run deploy
                  env:
                    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            deploy-pages:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                - run: npm ci
                - run: npm run build
                - uses: cloudflare/wrangler-action@v3
                  with:
                    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                    command: pages deploy dist --project-name=916slabs
          EOF

      - name: Create src/index.ts
        run: |
          cat > src/index.ts << 'EOF'
          import { Logger } from './utils/logger';
          import { handleError } from './utils/errorHandler';

          const logger = new Logger();

          export default {
            async fetch(request: Request): Promise<Response> {
              try {
                logger.info('Processing request...');
                const url = new URL(request.url);
                if (url.pathname === '/api/endpoint') {
                  return new Response(JSON.stringify({ message: "Hello from 916slabs!" }), {
                    headers: { 'Content-Type': 'application/json' },
                  });
                }
                return new Response('Not Found', { status: 404 });
              } catch (error) {
                return handleError(error, logger);
              }
            },
          };
          EOF

      - name: Create src/utils/logger.ts
        run: |
          cat > src/utils/logger.ts << 'EOF'
          import winston from 'winston';

          export class Logger {
            private logger: winston.Logger;

            constructor() {
              this.logger = winston.createLogger({
                level: 'info',
                format: winston.format.combine(
                  winston.format.timestamp(),
                  winston.format.json()
                ),
                transports: [
                  new winston.transports.Console(),
                  new winston.transports.File({ filename: 'logs/error.log', level: 'error' }),
                  new winston.transports.File({ filename: 'logs/combined.log' }),
                ],
              });
            }

            info(message: string) {
              this.logger.info(message);
            }

            error(message: string, error?: Error) {
              this.logger.error(message, { error: error?.stack });
            }
          }
          EOF

      - name: Create src/utils/errorHandler.ts
        run: |
          cat > src/utils/errorHandler.ts << 'EOF'
          import { Logger } from './logger';

          export function handleError(error: unknown, logger: Logger): Response {
            logger.error('Unhandled error', error instanceof Error ? error : new Error(String(error)));
            return new Response(JSON.stringify({ error: 'Internal Server Error' }), {
              status: 500,
              headers: { 'Content-Type': 'application/json' },
            });
          }
          EOF

      - name: Create src/tests/index.test.ts
        run: |
          cat > src/tests/index.test.ts << 'EOF'
          import { fetch } from '../index';
          import { Request } from '@cloudflare/workers-types';

          describe('916slabs API', () => {
            it('should return 200 for /api/endpoint', async () => {
              const request = new Request('http://localhost/api/endpoint');
              const response = await fetch(request);
              expect(response.status).toBe(200);
              const data = await response.json();
              expect(data.message).toBe("Hello from 916slabs!");
            });

            it('should return 404 for unknown routes', async () => {
              const request = new Request('http://localhost/unknown');
              const response = await fetch(request);
              expect(response.status).toBe(404);
            });
          });
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "Lamont Gordon"
          git config --global user.email "your-email@example.com"
          git add .
          git commit -m "feat: Add Cloudflare Pages support to 916slabs repository"
          git push origin HEAD:improvements/916slabs
