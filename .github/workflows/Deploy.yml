name: Deploy 916slabs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Disable Bun (force npm)
        run: |
          echo "NODE_OPTIONS=--no-experimental-global-webcrypto" >> $GITHUB_ENV
          echo "npm_config_user_agent=npm" >> $GITHUB_ENV

      - name: Delete package-lock.json and node_modules
        run: |
          rm -f package-lock.json
          rm -rf node_modules

      - name: Install dependencies with npm
        run: npm install --ignore-scripts

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
