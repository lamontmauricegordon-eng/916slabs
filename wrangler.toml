name = "916slabs"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "experimental_d1"]

pages_build_output_dir = "_site"

# ==================== AI Binding ====================
[ai]
binding = "AI"

# ==================== Workflows ====================
[[workflows]]
name = "content-processor"
class_name = "ContentProcessorWorkflow"

# ==================== KV Namespaces ====================
[[kv_namespaces]]
binding = "KV"
id = "KV slabs__916slabs1-workers_sites_assets"   # Using the KV you listed

# ==================== R2 Buckets ====================
[[r2_buckets]]
binding = "R2"
bucket_name = "916-slabs-bucket"                  # Your R2 bucket

# ==================== Service Bindings ====================
[[services]]
binding = "WORKER_SERVICE"
service = "916-slabs"                             # Your service binding
environment = "production"

# ==================== Environment Variables ====================
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://916slabs.pages.dev"
VERSION = "1.0.0"

# ==================== Site & Build Settings ====================
[site]
bucket = "./_site"
include = ["**/*"]
exclude = [
  "node_modules",
  ".git",
  "*.toml",
  "src/workflows/**/*.ts"
]

# ==================== Observability ====================
[observability]
enabled = true
head_sampling_rate = 1

# ==================== Triggers ====================
[[triggers]]
crons = ["0 9 * * *"]

placement.mode = "smart"
