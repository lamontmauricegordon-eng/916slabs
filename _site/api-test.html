<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
<title>API Test | 916 Slabs</title>
<link rel="stylesheet" href="/assets/css/main.css">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <header class="site-header">
  <nav>
    <a href="/" class="">Home</a>
    <a href="/about" class="">About</a>
    <a href="/blog" class="">Blog</a>
    <button id="theme-toggle">🌓</button>
  </nav>
</header>

  <main class="container">
    <h1 style="color:white;">916SLABS API Test Page</h1>

<div id="output" style="white-space:pre; background:black; color:#0f0; padding:20px;"></div>

<script>
async function runTests() {
  const base = "/api";

  async function get(path) {
    const res = await fetch(base + path);
    return res.json();
  }

  const results = {
    status: await get("/status"),
    kv: await get("/kv?key=test"),
    r2: await get("/r2"),
    ai: await get("/ai"),
    service: await get("/service")
  };

  document.getElementById("output").textContent =
    JSON.stringify(results, null, 2);
}

runTests();
</script>

  </main>
  <footer class="site-footer">
  <p>&copy; 2026 916 Slabs</p>
</footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
